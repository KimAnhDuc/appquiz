<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14101F">
<title>Đố Vui</title>
<style>
  :root { --bg:#14101F; --card:#231C35; --line:#3A3054; --text:#F5F2FF; --dim:#A99FC4; --accent:#FF4F8B; --ok:#26A65B; --bad:#D32F4F;
          --A:#E21B3C; --B:#1368CE; --C:#D89E00; --D:#26890C; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; transition:background .3s; }
  body.ok { background:var(--ok); } body.bad { background:var(--bad); }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.12); flex:none; }
  header .logo { font-weight:800; letter-spacing:.5px; }
  header .me { margin-left:auto; display:flex; align-items:center; gap:8px; font-weight:600; min-width:0; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; flex:none; }
  .badge { font-size:13px; font-weight:800; background:rgba(255,255,255,.14); border-radius:6px; padding:2px 7px; font-variant-numeric:tabular-nums; }
  main { flex:1; min-height:0; padding:16px; width:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column; }
  h1 { font-size:24px; margin:0 0 6px; }
  h2 { font-size:20px; line-height:1.35; margin:0 0 12px; }
  p { color:var(--dim); margin:0 0 14px; line-height:1.5; }
  body.ok p, body.bad p { color:rgba(255,255,255,.85); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px 14px; margin-bottom:14px; }
  input { width:100%; font:inherit; font-size:18px; color:var(--text); background:#0F0B18; border:2px solid var(--line); border-radius:12px; padding:14px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { width:100%; font:inherit; font-size:18px; font-weight:700; border:none; border-radius:12px; padding:16px; margin-top:12px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; }
  .row { display:flex; align-items:center; gap:10px; padding:9px 0; }
  .row + .row { border-top:1px solid var(--line); }
  .row .score { margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums; }
  .err { color:#FFB4B4; min-height:1.4em; margin-top:10px; text-align:center; }
  .big { font-size:64px; text-align:center; margin:8px 0; line-height:1.1; }
  .center { text-align:center; }

  /* The 4 answer boxes */
  .bar { display:flex; justify-content:space-between; align-items:center; color:var(--dim); font-weight:700; margin-bottom:10px; font-variant-numeric:tabular-nums; }
  .bar .t { color:var(--accent); font-size:18px; }
  .grid { flex:1; min-height:300px; display:grid; grid-template:1fr 1fr / 1fr 1fr; gap:10px; }
  .opt { min-width:0; margin:0; border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
         color:#fff; box-shadow:inset 0 -6px 0 rgba(0,0,0,.25); transition:transform .08s; overflow:hidden; }
  .opt:active { transform:scale(.96); }
  .opt .shape { font-size:28px; line-height:1; opacity:.9; }
  .opt .letter { font-size:44px; font-weight:900; line-height:1; }
  .opt .txt { font-size:15px; font-weight:600; line-height:1.25; text-align:center; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .A { background:var(--A); } .B { background:var(--B); } .C { background:var(--C); } .D { background:var(--D); }
  .picked { margin:16px auto; width:62%; aspect-ratio:1; border-radius:24px; }
  .picked .letter { font-size:80px; }
  .answer { display:flex; align-items:center; gap:12px; border-radius:14px; padding:12px 14px; margin:8px 0 16px; font-weight:700; color:#fff; }
  .answer .letter { font-size:30px; font-weight:900; }
</style>
</head>
<body>
<header>
  <span class="logo">🧠 ĐỐ VUI</span>
  <span class="me" id="me"></span>
</header>
<main id="app"><p>Đang kết nối tới TV…</p></main>

<script>
const LETTERS = ['A', 'B', 'C', 'D'];
const SHAPES = ['▲', '◆', '●', '■'];
const app = document.getElementById('app');
const meEl = document.getElementById('me');
let pid = null;
try { pid = new URLSearchParams(location.search).get('pid') || localStorage.getItem('pg_pid'); } catch (e) {}
let lastKey = '';
let st = null;
let busy = false;

function savePid(v) { pid = v; try { v ? localStorage.setItem('pg_pid', v) : localStorage.removeItem('pg_pid'); } catch (e) {} }

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'onclick') el.onclick = v;
    else if (k === 'style') el.style.cssText = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const dot = c => h('span', { class: 'dot', style: 'background:' + c });

async function post(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(Object.assign({ pid: pid || '' }, data || {})) });
  return r.json();
}

async function act(path, data, errEl) {
  if (busy) return;
  busy = true;
  try {
    const res = await post(path, data);
    if (!res.ok && errEl) errEl.textContent = res.error || 'Có lỗi xảy ra';
    if (res.ok) { lastKey = ''; await poll(); }
  } catch (e) {
    if (errEl) errEl.textContent = 'Mất kết nối tới TV';
  } finally { busy = false; }
}

async function poll() {
  try {
    const r = await fetch('/api/state?pid=' + encodeURIComponent(pid || ''), { cache: 'no-store' });
    st = await r.json();
    if (pid && !st.me) savePid(null); // TV app restarted -> join again
    render();
  } catch (e) {
    meEl.textContent = '⚠️ Mất kết nối';
  }
}

function viewKey() {
  const me = st.me;
  if (!me) return 'join';
  switch (st.phase) {
    case 'LOBBY': return ['lobby', st.players.map(p => p.name + p.vip).join(','), me.vip].join('|');
    case 'QUESTION': return ['q', st.index, me.choice].join('|');
    case 'REVEAL': return ['r', st.index].join('|');
    default: return ['f', me.vip, st.players.map(p => p.score).join(',')].join('|');
  }
}

function render() {
  const me = st.me;
  meEl.replaceChildren(...(me ? [dot(me.color), h('span', null, me.name), h('span', { class: 'badge' }, me.score)] : []));
  document.body.className = me && st.phase === 'REVEAL' ? (me.lastCorrect ? 'ok' : 'bad') : '';

  const key = viewKey();
  if (key !== lastKey) {
    lastKey = key;
    app.replaceChildren(...build());
    const focus = app.querySelector('[autofocus]');
    if (focus) focus.focus();
  }
  const t = document.getElementById('timer');
  if (t) t.textContent = '⏱ ' + st.remaining + 's';
  const c = document.getElementById('progress');
  if (c) c.textContent = st.players.filter(p => p.done).length + '/' + st.players.length + ' người đã trả lời';
}

function tile(i, extraClass, withText) {
  return h('div', { class: 'opt ' + LETTERS[i] + ' ' + (extraClass || '') },
    h('span', { class: 'shape' }, SHAPES[i]),
    h('span', { class: 'letter' }, LETTERS[i]),
    withText && st.question ? h('span', { class: 'txt' }, st.question.options[i]) : null);
}

function build() {
  const me = st.me;
  if (!me) return joinView();

  if (st.phase === 'LOBBY') {
    const err = h('div', { class: 'err' });
    return [
      h('h1', null, 'Đã vào phòng!'),
      h('p', null, me.vip ? 'Bạn là VIP 👑 – bấm Bắt đầu khi mọi người đã vào đủ.' : 'Nhìn lên TV và chờ VIP 👑 bắt đầu nhé.'),
      h('div', { class: 'card' }, st.players.map(p => h('div', { class: 'row' }, dot(p.color), p.name, p.vip ? ' 👑' : ''))),
      me.vip ? h('button', { onclick: () => act('/api/start', {}, err) }, '🚀 Bắt đầu (' + st.total + ' câu)') : null,
      err
    ];
  }

  if (st.phase === 'QUESTION') {
    const bar = h('div', { class: 'bar' }, h('span', null, 'Câu ' + st.index + '/' + st.total), h('span', { class: 't', id: 'timer' }));
    if (me.choice != null) return [
      bar,
      tile(me.choice, 'picked', false),
      h('h2', { class: 'center' }, 'Đã chọn ' + LETTERS[me.choice]),
      h('p', { class: 'center', id: 'progress' })
    ];
    const err = h('div', { class: 'err' });
    const grid = h('div', { class: 'grid' }, [0, 1, 2, 3].map(i => {
      const t = tile(i, '', true);
      t.onclick = () => act('/api/answer', { choice: i }, err);
      return t;
    }));
    return [bar, grid, err];
  }

  if (st.phase === 'REVEAL') {
    const q = st.question;
    const head = me.lastCorrect === true ? ['✅', 'Chính xác! +' + me.lastGain]
      : me.lastCorrect === false ? ['❌', 'Sai rồi!'] : ['⏰', 'Hết giờ!'];
    return [
      h('div', { class: 'big' }, head[0]),
      h('h1', { class: 'center' }, head[1]),
      h('p', { class: 'center' }, 'Đáp án đúng:'),
      h('div', { class: 'answer ' + LETTERS[q.answer] }, h('span', { class: 'letter' }, LETTERS[q.answer]), q.options[q.answer]),
      h('h2', { class: 'center' }, 'Hạng ' + me.rank + ' · ' + me.score + ' điểm'),
      h('p', { class: 'center' }, st.index < st.total ? 'Câu tiếp theo sắp tới…' : 'Sắp có kết quả chung cuộc…')
    ];
  }

  // FINAL
  const ranking = [...st.players].sort((a, b) => b.score - a.score || b.correct - a.correct);
  const err = h('div', { class: 'err' });
  const medal = ['🏆', '🥈', '🥉'][me.rank - 1] || '🎈';
  return [
    h('div', { class: 'big' }, medal),
    h('h1', { class: 'center' }, me.rank === 1 ? 'Bạn vô địch!' : 'Hạng ' + me.rank),
    h('p', { class: 'center' }, me.score + ' điểm · đúng ' + me.correct + '/' + st.total + ' câu'),
    h('div', { class: 'card' }, ranking.map((p, i) => h('div', { class: 'row' },
      (i + 1) + '.', dot(p.color), p.name, h('span', { class: 'score' }, p.score)))),
    me.vip ? h('button', { onclick: () => act('/api/again', {}, err) }, 'Chơi ván mới') : h('p', { class: 'center' }, 'Chờ VIP 👑 bấm chơi ván mới.'),
    err
  ];
}

function joinView() {
  let saved = '';
  try { saved = localStorage.getItem('pg_name') || ''; } catch (e) {}
  const name = h('input', { maxlength: 12, placeholder: 'Tên của bạn', value: saved, autofocus: true, autocomplete: 'off' });
  const err = h('div', { class: 'err' });
  const go = async () => {
    const n = name.value.trim();
    if (!n) { err.textContent = 'Nhập tên đã nhé'; return; }
    try { localStorage.setItem('pg_name', n); } catch (e) {}
    try {
      const res = await post('/api/join', { name: n });
      if (!res.ok) { err.textContent = res.error; return; }
      savePid(res.pid); lastKey = ''; poll();
    } catch (e) { err.textContent = 'Mất kết nối tới TV'; }
  };
  name.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  return [
    h('h1', null, 'Vào phòng chơi'),
    h('p', null, 'Câu hỏi hiện trên TV, bạn chọn A, B, C hoặc D trên điện thoại. Đúng và nhanh thì càng nhiều điểm!'),
    name, h('button', { onclick: go }, 'Vào chơi'), err
  ];
}

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
